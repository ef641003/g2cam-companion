name: APK をビルド

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest には Android SDK（platform 34 / build-tools 34）が入っている
      - name: SDK ライセンスに同意
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: デバッグ APK をビルド
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        with:
          name: g2cam-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 配布ページ（Releases）に版ごとの APK を置く。コンパニオンの「更新」と、いつでも最新を指す
      # https://github.com/ef641003/g2cam-companion/releases/latest/download/g2cam-companion.apk はここを見る
      - name: 配布ページに APK を置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk g2cam-companion.apk
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" g2cam-companion.apk --clobber
          else
            gh release create "v$VER" g2cam-companion.apk --target "$GITHUB_SHA" --title "コンパニオン $VER" --notes "$(git log -1 --pretty=%s)" --latest
          fi

      # 遡り録画の区切りの計算（PreRollPlan）など、端末の要らない試験。APK を置いてから走らせる
      - name: 単体試験
        run: |
          set -o pipefail
          echo "===== 単体試験 =====" >> build.log
          gradle --no-daemon testDebugUnitTest 2>&1 | tee -a build.log

      # 失敗の原因を読めるよう、ビルドログを build-log ブランチに置く
      - name: ビルドログを build-log ブランチへ
        if: always()
        run: |
          mkdir -p /tmp/bl && cp build.log /tmp/bl/ 2>/dev/null || true
          cp -r app/build/reports/tests /tmp/bl/unit-tests 2>/dev/null || true
          cd /tmp/bl
          git init -q -b build-log
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log || true
