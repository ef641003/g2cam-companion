name: APK をビルド

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest には Android SDK（platform 34 / build-tools 34）が入っている
      - name: SDK ライセンスに同意
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: デバッグ APK をビルド
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      # 失敗の原因を読めるよう、ビルドログを build-log ブランチに置く
      - name: ビルドログを build-log ブランチへ
        if: always()
        run: |
          mkdir -p /tmp/bl && cp build.log /tmp/bl/ 2>/dev/null || true
          cd /tmp/bl
          git init -q -b build-log
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log || true

      - uses: actions/upload-artifact@v4
        with:
          name: g2cam-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
